[package]
name = "arena-next-macos-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Small native AppKit overlay host for ArenaNext on macOS"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
arena-next-popup = { package = "arena-popup", path = "../../../crates/arena-popup" }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSAlert",
  "NSBox",
  "NSButton",
  "NSColor",
  "NSControl",
  "NSFont",
  "NSImage",
  "NSImageView",
  "NSGraphics",
  "NSPanel",
  "NSPopover",
  "NSProgressIndicator",
  "NSPopover",
  "NSViewController",
  "NSResponder",
  "NSEvent",
  "NSRunningApplication",
  "NSScreen",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSMenu",
  "NSMenuItem",
  "NSTextField",
  "NSView",
  "NSViewController",
  "NSWindow",
  "NSWorkspace",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSDate",
  "NSData",
  "NSGeometry",
  "NSRunLoop",
  "NSString",
  "objc2-core-foundation",
] }
